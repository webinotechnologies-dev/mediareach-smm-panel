<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary Accent Gradient (Indigo to Cyan) -->
    <linearGradient id="mGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="mGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Geometric Interlocking "M" Reach Wings -->
  <!-- Left Pillar -->
  <path d="M26 68 V34 C26 30 30 28 33 30 L48 45 L41 53 L34 45 V68 Z" fill="url(#mGrad1)" />
  
  <!-- Right Pillar & Upward Growth Peak -->
  <path d="M74 68 V34 C74 30 70 28 67 30 L52 45 L59 53 L66 45 V68 Z" fill="url(#mGrad1)" />

  <!-- Central Dynamic Apex Arrow (Reach Indicator) -->
  <path d="M50 22 L62 38 L54 44 L50 38 L46 44 L38 38 Z" fill="url(#mGrad2)" />

  <!-- Subtle Center Core Light Dot -->
  <circle cx="50" cy="58" r="3.5" fill="#38bdf8" />
</svg>
